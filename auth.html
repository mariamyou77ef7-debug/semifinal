<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>auth</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Glory:ital,wght@0,100..800;1,100..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Left Banner Side -->
      <div class="login-banner">
        <img src="img/812c1c4a9f919676849af803509fc8ff70b426f2.png" alt="Egypt Pyramids">
      </div>

      <!-- Right Form Side -->
      <div class="login-form-container">
        
        <!-- Logo -->
        <div class="logo">
          <div class="logo-text">
           <img src="./img/Logo.png" alt="logo" />
          </div>
        </div>

        <!-- Heading -->
        <div class="form-header">
          <h1>Welcome Back</h1>
          <p>Sign in to your account to continue your journey</p>
        </div>

        <!-- Form -->
        <form class="login-form">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Mena@gmail.com" required>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="••••••••" required>
              <i class="fa-regular fa-eye toggle-password"></i>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-pass">Forgot password?</a>
          </div>

          <button type="submit" class="btn-login">Login</button>
        </form>

        <!-- Divider -->
        <div class="divider">
          <span>Or continue with</span>
        </div>

        <!-- Social Login -->
        <div class="social-login">
          <button type="button" class="btn-social">
            <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
          </button>
          <button type="button" class="btn-social">
            <i class="fa-brands fa-apple" style="color: #000;"></i> Apple
          </button>
        </div>

        <!-- Sign Up Link -->
        <div class="form-footer">
          <p>Don't have an account? <a href="createacc.html">Create account</a></p>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
</body>
</html>
