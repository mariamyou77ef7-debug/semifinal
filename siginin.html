<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="signin.css">
</head>
<body>

  <div class="forgot-wrapper">
    <div class="forgot-card">
      
      <!-- Left Banner Side -->
      <div class="forgot-banner">
        <img src="img/812c1c4a9f919676849af803509fc8ff70b426f2.png" alt="Egypt Pyramids">
      </div>

      <!-- Right Form Side -->
      <div class="forgot-form-container">
        
        <!-- Logo -->
        <div class="logo">
          <img src="./img/Logo.png" alt="logo"/>
        </div>

        <!-- Heading -->
        <div class="form-header">
          <h1>Forgot Password?</h1>
          <p>Don't worry! Enter your email and we'll send you a verification code</p>
        </div>

        <!-- Form -->
        <form class="forgot-form">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Mena@gmail.com" required>
          </div>

          <button type="submit" class="btn-send"><a href="verify.html">Send Verification Code</a></button>
        </form>


      </div>

    </div>
  </div>

</body>
</html>
