<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="craeteacc.css">
</head>
<body>

  <div class="signup-wrapper">
    <div class="signup-card">
      
      <!-- Left Banner Side -->
      <div class="signup-banner">
        <img src="img/812c1c4a9f919676849af803509fc8ff70b426f2.png" alt="Egypt Pyramids">
      </div>

      <!-- Right Form Side -->
      <div class="signup-form-container">
        
        <!-- Logo -->
        <div class="logo">
          <div class="logo-text">
           <img src="./img/Logo.png" /> 
          </div>
        </div>

        <!-- Heading -->
        <div class="form-header">
          <h1>Create Account</h1>
          <p>Join 50,000+ travelers exploring Egypt</p>
        </div>

        <!-- Form -->
        <form class="signup-form">
          <div class="input-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Mena" required>
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Mena@gmail.com" required>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="••••••••" required>
              <i class="fa-regular fa-eye toggle-password"></i>
            </div>
          </div>

          <div class="input-group">
            <label for="confirm-password">Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" id="confirm-password" placeholder="••••••••" required>
              <i class="fa-regular fa-eye toggle-password"></i>
            </div>
          </div>

          <button type="submit" class="btn-signup">Create Account</button>
        </form>

        <!-- Sign In Link -->
        <div class="form-footer">
          <p>have an account? <a href="siginin.html">Signin</a></p>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
