<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="verify.css">
</head>
<body>

  <div class="verify-wrapper">
    <div class="verify-card">
      
    
      <div class="verify-banner">
        <img src="img/812c1c4a9f919676849af803509fc8ff70b426f2.png" alt="Egypt Pyramids">

      </div>

      <div class="verify-form-container">
        
        <!-- Logo -->
        <div class="logo">
        <img src="./img/Logo.png" />
        </div>

        <!-- Heading -->
        <div class="form-header">
          <h1>Verify Your Account</h1>
          <p>Enter the 4-digit code sent to your phone or email.</p>
        </div>

        <!-- Verification Form -->
        <form class="verify-form">
          <div class="otp-container">
            <input type="text" maxlength="1" value="2" required>
            <input type="text" maxlength="1" value="7" required>
            <input type="text" maxlength="1" class="active" autofocus required>
            <input type="text" maxlength="1" required>
          </div>

          <div class="timer">00:30</div>

          <button type="submit" class="btn-verify">Send Verification Code</button>
        </form>

        <div class="form-footer">
          <p>Didn't receive OTP? <a href="#">Send Again</a></p>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
